<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alballoon サポート</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <header>
        <nav>
            <h1>志貴野自動車工業株式会社</h1>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>志貴野自動車工業株式会社へようこそ</h1>
            <p>志貴野自動車工業株式会社は、高岡市新成町に位置する自動車整備工場です。</p>
            <p>恋人、友人、家族との特別な瞬間を保存し、時には過去の思い出を振り返りながら、感謝の気持ちを伝えるきっかけを作りましょう。</p>
            <div class="features">
                <div class="feature-item">
                    <h3>🤍 車検整備</h3>
                    <p>あなたの車検を良心的なお値段</p>
                </div>
                <div class="feature-item">
                    <h3>📸 中古車販売</h3>
                    <p>お求めの中古車をご一緒にお探しします</p>
                </div>
                <div class="feature-item">
                    <h3>💝 タイヤ交換</h3>
                    <p>スピーディかつ丁寧に交換いたします</p>
                </div>
            </div>
        </section>

        <section class="contact-section">
            <h2>お問い合わせ</h2>
            <form class="contact-form" id="contactForm">
                <input type="text" name="name" placeholder="お名前" required>
                <input type="email" name="email" placeholder="メールアドレス" required>
                <select name="category" required>
                    <option value="">お問い合わせ種別を選択してください</option>
                    <option value="account">アカウントについて</option>
                    <option value="bug">不具合の報告</option>
                    <option value="other">その他</option>
                </select>
                <textarea name="message" placeholder="お問い合わせ内容" required></textarea>
                <button type="submit">送信する</button>
                <div id="formMessage" class="form-message"></div>
            </form>
        </section>
    </main>

    <footer>
        <div class="btn-box">
            <a href="/terms">利用規約</a>
            <a href="/privacy">プライバシーポリシー</a>
        </div>
        <p>&copy; 2024 alballoon. All rights reserved.</p>
    </footer>

    <script src="/js/script.js"></script>
</body>

</html>
